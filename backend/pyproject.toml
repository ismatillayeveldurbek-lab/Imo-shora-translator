[project]
name = "uzsign-backend"
version = "0.1.0"
description = "UzSign AI — FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.16,<3.0",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32,<1.0",
    "alembic>=1.20,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
# RUF001-003: Uzbek text intentionally uses apostrophe-like letters (oʻ, gʻ, ʼ).
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
